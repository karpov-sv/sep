[tox]
minversion = 4.0
envlist = py-{linux,macos,windows}
isolated_build = true

[gh-actions:env]
PLATFORM =
    ubuntu-24.04: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
passenv = HOME
deps = pytest
       astropy
allowlist_externals = make
commands =
       pytest test.py
       linux: make test
       macos: make test
