# This workflow will install tox and use it to run tests.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    # Tag pushes are tested inside the release workflow instead.
    branches: ['**']
    # Release preparation only updates the changelog; the tag tests that commit.
    paths-ignore: ['CHANGES.md']
  workflow_call:
  workflow_dispatch:
  pull_request:

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # Python 3.9 is unavailable on Ubuntu 26.04 (ubuntu-latest).
        os: [windows-latest, macos-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tox and any other packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
      - name: Run Tox
        # Run tox using the version of Python in `PATH`, append platform
        run: tox
        env:
          PLATFORM: ${{ matrix.os }}
